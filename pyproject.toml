[project]
name = "pandas-practice"
version = "0.1.0"
description = "Notebookで簡単なpandas操作を反射的に書けるようになるためのローカル学習システム"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Notebookから `from src.grader import check` できるよう、src をパッケージとしてeditable installする
[tool.setuptools]
packages = ["src"]
