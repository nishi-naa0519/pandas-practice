purpose: 各列が想定どおりの型で読み込まれているかを確認できるようにします。
statement: |
  `df` の**各列の型**を返してください。

  採点後、テストケースの結果を見て「なぜその列はその型になったのか」も考えてみましょう
  (失敗したときに入力と期待値が表示されます)。
data:
- customers.csv
setup: df = pd.read_csv("data/customers.csv")
preview: df.head()
signature: 'def solve(df: pd.DataFrame):'
run: solve(df)
hints:
- 列ごとの型は DataFrame の属性で確認できます
- df.dtypes
solution:
  code: |
    def solve(df: pd.DataFrame):
        return df.dtypes
  explanation: |
    `df.dtypes` は「列名 → 型」の Series です。

    このデータでは `age` が `float64` になっています。年齢は整数のはずですが、
    **欠損(NaN)を含む整数列は float になる**ためです。
  points: |
    - 型の確認は `df.dtypes`
    - よく見る型: `int64`(整数)/ `float64`(小数・欠損を含む整数)/ `str`(文字列)/ `bool` / `datetime64`
    - `read_csv` は日付を自動では日時型にしない → 日付列は `str` のまま
    - `"0600001"` のような郵便番号やIDは数値として読まれて**先頭の0が消える**ことがある
    - 「数値のはずなのに `str`」は、どこかに数値でない値("unknown" など)が混ざっているサイン
  mistakes: |
    - `df.dtype` → DataFrame にはない(Series なら `df["age"].dtype`)
    - `df.dtypes()` → 括弧は不要
